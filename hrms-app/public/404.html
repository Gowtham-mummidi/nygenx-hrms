<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Oklut HRMS</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      // For GitHub Project Pages (https://<user>.github.io/<repo>/), keep 1 segment; for root custom domains keep 0.
      var pathSegmentsToKeep = window.location.pathname.startsWith('/nygenx-hrms') ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
